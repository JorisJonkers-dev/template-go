# One command per loop. `task` lists targets; `task check` is what CI runs.
version: "3"

vars:
  APP: template-go

tasks:
  default:
    cmd: task --list
    silent: true

  gen:
    desc: Regenerate code (go generate)
    cmd: go generate ./...

  gen:check:
    desc: Fail if generated code is stale
    cmds:
      - task: gen
      - git diff --exit-code
      - cmd: |
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "generation left untracked files:" >&2
            git ls-files --others --exclude-standard >&2
            exit 1
          fi

  fmt:
    desc: Fail if any file is not gofumpt/goimports formatted
    cmd: golangci-lint fmt --diff ./...

  lint:
    desc: All linters
    cmds:
      - task: fmt
      - task: lint:go
      - task: lint:actions

  lint:go:
    desc: golangci-lint, and the estate test lints (tests named as behaviours, one t.Run per table row)
    cmds:
      - golangci-lint run ./...
      - golangci-lint run --build-tags integration ./...
      - go tool testlint ./...
      - go tool testlint -tags integration ./...

  lint:actions:
    desc: actionlint on every workflow
    cmd: actionlint

  test:
    desc: Unit tests with the race detector, held to every statement, branch, condition and function
    cmd: sh scripts/coverage.sh unit

  test:integration:
    desc: Unit and integration tests (the integration build tag), held to every function
    cmd: sh scripts/coverage.sh integration

  build:
    desc: Build the service binary
    env:
      CGO_ENABLED: "0"
    cmd: go build -trimpath -o bin/{{.APP}} ./cmd/{{.APP}}

  secrets:
    desc: Scan the working tree for secrets
    cmd: gitleaks dir --no-banner --redact .

  check:
    desc: Everything CI runs on a pull request
    cmds:
      - task: lint
      - task: gen:check
      - task: test
      - task: test:integration
      - task: build
      - task: secrets

  fix:
    desc: Apply formatters and autofixes
    cmds:
      - golangci-lint fmt ./...
      - golangci-lint run --fix ./...

  run:
    desc: Run the service locally on :8080
    cmd: go run ./cmd/{{.APP}}
