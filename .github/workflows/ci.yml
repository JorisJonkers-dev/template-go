# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# Every check is its own job, and they run in parallel: a pull request waits for the slowest
# check rather than the sum of them, which is worth the extra minutes GitHub bills per job.
# Each job runs one `task`, the same tasks `task check` runs in sequence, so local and CI
# cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every failure is reported, not only the first.
      fail-fast: false
      matrix:
        task: [lint, gen:check, test, test:integration, build, secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true

      - name: Run the task
        env:
          TASK: ${{ matrix.task }}
        run: mise exec -- task "$TASK"

  # The image builds need the Docker daemon the runner has, so they are not a task.
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: template-go
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        env:
          IMAGE: ${{ matrix.image }}
          ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086 # ARGS is a list of options, split on purpose
          docker build --build-arg VERSION=ci $ARGS -t "$IMAGE:ci" .

  # A skipped test whose quarantine ran out, names no issue, or lasts over 14 days fails the build
  # (workspace docs/testing-standards.md, section 7).
  quarantine:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@v0.27.3

  # Comments the mutants that survive on the lines a pull request changes. A report; it never fails
  # the build, so Pipeline Complete does not wait for it.
  mutation:
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/mutation-report.yml@v0.27.3
    permissions:
      contents: read
      pull-requests: write
    with:
      go-directory: .

  # The one required check: green only when every job above is. `always()` so a failed or
  # cancelled job still reports here, as a failure, rather than leaving the check pending.
  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [check, images, quarantine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job ended ${result}"; exit 1; }
          done
