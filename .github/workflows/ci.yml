# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# Every check is its own job, and they run in parallel: a pull request waits for the slowest
# check rather than the sum of them, which is worth the extra minutes GitHub bills per job.
# Each job runs one `task`, the same tasks `task check` runs in sequence, so local and CI
# cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every failure is reported, not only the first.
      fail-fast: false
      matrix:
        task: [lint, gen:check, test, test:integration, build, secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: true

      - name: Run the task
        env:
          TASK: ${{ matrix.task }}
        run: mise exec -- task "$TASK"

  # The image builds need the Docker daemon the runner has, so they are not a task.
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: template-go
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write packages proxy netrc
        id: proxy
        env:
          PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES_PROXY_TOKEN" ]; then
            echo "::warning::PACKAGES_PROXY_TOKEN is not set; packages install without the proxy."
            exit 0
          fi
          printf '::add-mask::%s\n' "$PACKAGES_PROXY_TOKEN"
          umask 077
          netrc="$RUNNER_TEMP/packages-netrc"
          {
            printf 'machine packages.jorisjonkers.dev\n'
            printf 'login packages\n'
            printf 'password %s\n' "$PACKAGES_PROXY_TOKEN"
          } > "$netrc"
          npmrc="$RUNNER_TEMP/packages-npmrc"
          {
            printf 'registry=https://packages.jorisjonkers.dev/npm/\n'
            printf '//packages.jorisjonkers.dev/npm/:_authToken=%s\n' "$PACKAGES_PROXY_TOKEN"
            printf '@jorisjonkers-dev:registry=https://npm.pkg.github.com\n'
          } > "$npmrc"
          {
            printf 'netrc=%s\n' "$netrc"
            printf 'npmrc=%s\n' "$npmrc"
            printf 'enabled=true\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build the image
        env:
          IMAGE: ${{ matrix.image }}
          ARGS: ${{ matrix.args }}
          PROXY_ENABLED: ${{ steps.proxy.outputs.enabled }}
          PROXY_NETRC: ${{ steps.proxy.outputs.netrc }}
          PROXY_NPMRC: ${{ steps.proxy.outputs.npmrc }}
        run: |
          set -euo pipefail
          proxy_args=()
          if [ "$PROXY_ENABLED" = true ]; then
            proxy_args=(
              --build-arg GOPROXY=https://packages.jorisjonkers.dev/go
              --build-arg PIP_INDEX_URL=https://packages.jorisjonkers.dev/pypi/simple/
              --build-arg UV_DEFAULT_INDEX=https://packages.jorisjonkers.dev/pypi/simple/
              --secret "id=packages-netrc,src=$PROXY_NETRC"
              --secret "id=packages-npmrc,src=$PROXY_NPMRC"
            )
          fi
          # shellcheck disable=SC2086 # ARGS is a list of options, split on purpose
          docker build --build-arg VERSION=ci $ARGS "${proxy_args[@]}" -t "$IMAGE:ci" .

  # A skipped test whose quarantine ran out, names no issue, or lasts over 14 days fails the build
  # (workspace docs/testing-standards.md, section 7).
  quarantine:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@48fcba8b143567e12716f4b77b9a3ab211719ffd # v0.50.1

  # Comments the mutants that survive on the lines a pull request changes. A report; it never fails
  # the build, so Pipeline Complete does not wait for it.
  mutation:
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/mutation-report.yml@48fcba8b143567e12716f4b77b9a3ab211719ffd # v0.50.1
    permissions:
      contents: read
      pull-requests: write
    with:
      go-directory: .
      require-package-proxy: true
    secrets:
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  # The one required check: green only when every job above is. `always()` so a failed or
  # cancelled job still reports here, as a failure, rather than leaving the check pending.
  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [check, images, quarantine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job ended ${result}"; exit 1; }
          done
